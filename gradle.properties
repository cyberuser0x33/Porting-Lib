org.gradle.jvmargs=-Xmx4G --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true

loom_version = 1.19.4

mod_version = 4.0.0

# https://fabricmc.net/develop
minecraft_version = 26.3
minecraft_dependency = >=26.3
loader_version = 0.20.1
fabric_api_version = 0.165.2+26.3

# Mixin Extra's
# https://github.com/LlamaLad7/MixinExtras
# If set to 'none' Mixin Extra's will not be JiJ'd and Porting Lib will use whatever version fabric loader bundles
# ! Reason: Expressions
mixin_extras_version = none

# Mappings: Minecraft 26.x is unobfuscated, so there are no mappings (and no Parchment).

# dev env mods
# https://modrinth.com/mod/lithium
lithium_version = mc1.21.11-0.21.0-fabric
# https://modrinth.com/mod/iris
iris_version = 1.10.1+1.21.11-fabric
# https://modrinth.com/mod/modmenu
modmenu_version = 11.0.0-beta.1
# https://modrinth.com/mod/vmp-fabric
vmp_version = 0.2.0+beta.7.222+1.21.11
